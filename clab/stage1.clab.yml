name: stage1
# EVPN-VXLAN 3-stage Clos — eBGP underlay + eBGP overlay (no RR, no IGP):
#   spines : spine1 (AS65100) / spine2 (AS65200) — eBGP EVPN relay, no VTEP/VRF
#   leaves : leaf1-4 (AS65001-65004) — VTEPs, anycast IRB, VRF CUST L3VNI 100
#   hosts  : host1 10.10.10.11 (ESI-LAG leaf1+leaf2) | host2 10.10.10.22 (ESI-LAG leaf3+leaf4)
#   ONE stretched L2VNI 10010 (10.10.10.0/24), anycast gw 10.10.10.1 on all leaves
#   site-A ES1 = leaf1+leaf2 ; site-B ES2 = leaf3+leaf4 (ESI-LAG dual-homing)
#   host1<->host2 = bridged EVPN Type-2 over the stretched L2VNI (same subnet).
#   fabric: 10.0.1.x via-spine1, 10.0.2.x via-spine2.
#   Host prereq on clab host: modprobe bonding. No MPLS / kernel-MPLS needed.

topology:
  defaults:
    kind: linux
    image: frrouting/frr:latest
  nodes:
    spine1: { kind: linux, image: ghcr.io/sysoleg/vyos-container:latest, binds: ["configs/spine1/config.boot:/opt/vyatta/etc/config/config.boot"], labels: {role: spine, nos: vyos} }
    spine2: { kind: linux, image: ghcr.io/sysoleg/vyos-container:latest, binds: ["configs/spine2/config.boot:/opt/vyatta/etc/config/config.boot"], labels: {role: spine, nos: vyos} }
    leaf1:  { kind: linux, image: ghcr.io/sysoleg/vyos-container:latest, binds: ["configs/leaf1/config.boot:/opt/vyatta/etc/config/config.boot"],  labels: {role: leaf, site: a, nos: vyos} }
    leaf2:  { kind: linux, image: ghcr.io/sysoleg/vyos-container:latest, binds: ["configs/leaf2/config.boot:/opt/vyatta/etc/config/config.boot"],  labels: {role: leaf, site: a, nos: vyos} }
    leaf3:  { kind: linux, image: ghcr.io/sysoleg/vyos-container:latest, binds: ["configs/leaf3/config.boot:/opt/vyatta/etc/config/config.boot"],  labels: {role: leaf, site: b, nos: vyos} }
    leaf4:  { kind: linux, image: ghcr.io/sysoleg/vyos-container:latest, binds: ["configs/leaf4/config.boot:/opt/vyatta/etc/config/config.boot"],  labels: {role: leaf, site: b, nos: vyos} }
    host1:
      image: frrouting/frr:latest
      binds: ["configs/host1/frr.conf:/etc/frr/frr.conf", "daemons:/etc/frr/daemons", "vtysh.conf:/etc/frr/vtysh.conf"]
      labels: {role: host, site: a}
      exec:
        - "ip link add bond0 type bond mode 802.3ad miimon 100 lacp_rate fast"
        - "ip link set eth1 down"
        - "ip link set eth2 down"
        - "ip link set eth1 master bond0"
        - "ip link set eth2 master bond0"
        - "ip link set bond0 up"
        - "ip link set eth1 up"
        - "ip link set eth2 up"
        - "ip addr add 10.10.10.11/24 dev bond0"
        - "ip route replace default via 10.10.10.1"
    host2:
      image: frrouting/frr:latest
      binds: ["configs/host2/frr.conf:/etc/frr/frr.conf", "daemons:/etc/frr/daemons", "vtysh.conf:/etc/frr/vtysh.conf"]
      labels: {role: host, site: b}
      exec:
        - "ip link add bond0 type bond mode 802.3ad miimon 100 lacp_rate fast"
        - "ip link set eth1 down"
        - "ip link set eth2 down"
        - "ip link set eth1 master bond0"
        - "ip link set eth2 master bond0"
        - "ip link set bond0 up"
        - "ip link set eth1 up"
        - "ip link set eth2 up"
        - "ip addr add 10.10.10.22/24 dev bond0"
        - "ip route replace default via 10.10.10.1"
  links:
    - endpoints: ["leaf1:eth1", "spine1:eth1"]
    - endpoints: ["leaf2:eth1", "spine1:eth2"]
    - endpoints: ["leaf3:eth1", "spine1:eth3"]
    - endpoints: ["leaf4:eth1", "spine1:eth4"]
    - endpoints: ["leaf1:eth2", "spine2:eth1"]
    - endpoints: ["leaf2:eth2", "spine2:eth2"]
    - endpoints: ["leaf3:eth2", "spine2:eth3"]
    - endpoints: ["leaf4:eth2", "spine2:eth4"]
    - endpoints: ["host1:eth1", "leaf1:eth3"]
    - endpoints: ["host1:eth2", "leaf2:eth3"]
    - endpoints: ["host2:eth1", "leaf3:eth3"]
    - endpoints: ["host2:eth2", "leaf4:eth3"]

