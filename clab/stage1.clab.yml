name: stage1
# EVPN-VXLAN 3-stage Clos — eBGP underlay + eBGP overlay (no RR, no IGP):
#   spines: p1 (AS65100), p2 (AS65200)   — pure eBGP relay, no VTEP/VRF
#   leaves: pe1-4 (AS65001-65004)        — VTEP, VRF CUST L3VNI 100, anycast-less routed CE
#   customers: ce1 (AS65010) dual-homed pe1+pe2 | ce2 (AS65020) dual-homed pe3+pe4
#   fabric: 10.0.1.x = via-spine1, 10.0.2.x = via-spine2 ; leaves dual-uplinked.
#
#   underlay: eBGP /31, redistribute connected (loopbacks), maximum-paths ebgp
#   overlay : eBGP l2vpn-evpn on same sessions; spines relay (retain route-target
#             all applied to spines post-deploy via tools/init-evpn.sh)
#   leaves  : bestpath as-path multipath-relax (ECMP across spine1/spine2 ASNs)
#   NO kernel modules required (VXLAN over plain UDP/4789).

topology:
  defaults:
    kind: linux
    image: frrouting/frr:latest
    sysctls:
      net.ipv4.ip_forward: 1
  nodes:
    p1:  { kind: linux, image: ghcr.io/sysoleg/vyos-container:latest, binds: ["configs/p1/config.boot:/opt/vyatta/etc/config/config.boot"],  labels: {role: spine, nos: vyos} }
    p2:  { kind: linux, image: ghcr.io/sysoleg/vyos-container:latest, binds: ["configs/p2/config.boot:/opt/vyatta/etc/config/config.boot"],  labels: {role: spine, nos: vyos} }
    pe1: { kind: linux, image: ghcr.io/sysoleg/vyos-container:latest, binds: ["configs/pe1/config.boot:/opt/vyatta/etc/config/config.boot"], labels: {role: leaf, site: a, nos: vyos} }
    pe2: { kind: linux, image: ghcr.io/sysoleg/vyos-container:latest, binds: ["configs/pe2/config.boot:/opt/vyatta/etc/config/config.boot"], labels: {role: leaf, site: a, nos: vyos} }
    pe3: { kind: linux, image: ghcr.io/sysoleg/vyos-container:latest, binds: ["configs/pe3/config.boot:/opt/vyatta/etc/config/config.boot"], labels: {role: leaf, site: b, nos: vyos} }
    pe4: { kind: linux, image: ghcr.io/sysoleg/vyos-container:latest, binds: ["configs/pe4/config.boot:/opt/vyatta/etc/config/config.boot"], labels: {role: leaf, site: b, nos: vyos} }
    ce1: { image: frrouting/frr:latest, binds: ["configs/ce1/frr.conf:/etc/frr/frr.conf", "daemons:/etc/frr/daemons", "vtysh.conf:/etc/frr/vtysh.conf"], labels: {role: ce, site: a, nos: frr} }
    ce2: { image: frrouting/frr:latest, binds: ["configs/ce2/frr.conf:/etc/frr/frr.conf", "daemons:/etc/frr/daemons", "vtysh.conf:/etc/frr/vtysh.conf"], labels: {role: ce, site: b, nos: frr} }
  links:
    # leaf -> spine1 (10.0.1.x)
    - endpoints: ["pe1:eth1", "p1:eth1"]
    - endpoints: ["pe2:eth1", "p1:eth2"]
    - endpoints: ["pe3:eth1", "p1:eth3"]
    - endpoints: ["pe4:eth1", "p1:eth4"]
    # leaf -> spine2 (10.0.2.x)
    - endpoints: ["pe1:eth2", "p2:eth1"]
    - endpoints: ["pe2:eth2", "p2:eth2"]
    - endpoints: ["pe3:eth2", "p2:eth3"]
    - endpoints: ["pe4:eth2", "p2:eth4"]
    # customers
    - endpoints: ["ce1:eth1", "pe1:eth3"]
    - endpoints: ["ce1:eth2", "pe2:eth3"]
    - endpoints: ["ce2:eth1", "pe3:eth3"]
    - endpoints: ["ce2:eth2", "pe4:eth3"]
