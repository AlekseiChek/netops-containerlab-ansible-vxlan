name: stage1
# Redundant 2-site SP fabric — VyOS core (EVPN-VXLAN) + FRR customers:
#   site-A: ce1 dual-homed to pe1+pe2   |   site-B: ce2 dual-homed to pe3+pe4
#   core: p1/p2 (IS-IS L2) + 2 route reflectors rr1/rr2 (iBGP + l2vpn-evpn, redundant).
#   All PEs and RRs are dual-attached to BOTH p1 and p2.  10 nodes, 17 links.
#
# SP feature set (VyOS core):
#   - IS-IS L2, metric-style WIDE
#   - Plain IP transport (no MPLS, no SR) — zero host kernel requirements
#   - EVPN-VXLAN L3VPN: ce1 + ce2 share ONE VRF "CUST" (L3VNI 100)
#   - BGP l2vpn-evpn address-family, reflected by rr1/rr2
#   - VTEP source = PE loopback; VXLAN UDP/4789 over plain IP
#   - PE-CE eBGP inside VRF CUST; CE prefixes advertised as EVPN Type-5 routes
#
# NO kernel modules required. VXLAN is plain UDP/4789 over IS-IS-learned IP routes.

topology:
  defaults:
    kind: linux
    image: frrouting/frr:latest
  nodes:
    # --- core: VyOS (sysoleg/vyos-container), config.boot bind-mounted ---
    rr1: { kind: linux, image: ghcr.io/sysoleg/vyos-container:latest, binds: ["configs/rr1/config.boot:/opt/vyatta/etc/config/config.boot"], labels: {role: rr, location: core, nos: vyos} }
    rr2: { kind: linux, image: ghcr.io/sysoleg/vyos-container:latest, binds: ["configs/rr2/config.boot:/opt/vyatta/etc/config/config.boot"], labels: {role: rr, location: core, nos: vyos} }
    p1:  { kind: linux, image: ghcr.io/sysoleg/vyos-container:latest, binds: ["configs/p1/config.boot:/opt/vyatta/etc/config/config.boot"],  labels: {role: p,  location: core, nos: vyos} }
    p2:  { kind: linux, image: ghcr.io/sysoleg/vyos-container:latest, binds: ["configs/p2/config.boot:/opt/vyatta/etc/config/config.boot"],  labels: {role: p,  location: core, nos: vyos} }
    pe1: { kind: linux, image: ghcr.io/sysoleg/vyos-container:latest, binds: ["configs/pe1/config.boot:/opt/vyatta/etc/config/config.boot"], labels: {role: pe, location: site-a, nos: vyos} }
    pe2: { kind: linux, image: ghcr.io/sysoleg/vyos-container:latest, binds: ["configs/pe2/config.boot:/opt/vyatta/etc/config/config.boot"], labels: {role: pe, location: site-a, nos: vyos} }
    pe3: { kind: linux, image: ghcr.io/sysoleg/vyos-container:latest, binds: ["configs/pe3/config.boot:/opt/vyatta/etc/config/config.boot"], labels: {role: pe, location: site-b, nos: vyos} }
    pe4: { kind: linux, image: ghcr.io/sysoleg/vyos-container:latest, binds: ["configs/pe4/config.boot:/opt/vyatta/etc/config/config.boot"], labels: {role: pe, location: site-b, nos: vyos} }
    # --- customer edge: stay FRR (light) ---
    ce1: { image: frrouting/frr:latest, binds: ["configs/ce1/frr.conf:/etc/frr/frr.conf", "daemons:/etc/frr/daemons", "vtysh.conf:/etc/frr/vtysh.conf"], labels: {role: ce, location: site-a, nos: frr} }
    ce2: { image: frrouting/frr:latest, binds: ["configs/ce2/frr.conf:/etc/frr/frr.conf", "daemons:/etc/frr/daemons", "vtysh.conf:/etc/frr/vtysh.conf"], labels: {role: ce, location: site-b, nos: frr} }
  links:
    # core
    - endpoints: ["p1:eth1",  "p2:eth1"]    # 10.0.0.0/31
    # site-A PEs dual-attached to core
    - endpoints: ["pe1:eth1", "p1:eth2"]    # 10.0.0.2/31
    - endpoints: ["pe1:eth2", "p2:eth2"]    # 10.0.0.4/31
    - endpoints: ["pe2:eth1", "p1:eth3"]    # 10.0.0.6/31
    - endpoints: ["pe2:eth2", "p2:eth3"]    # 10.0.0.8/31
    # site-B PEs dual-attached to core
    - endpoints: ["pe3:eth1", "p1:eth4"]    # 10.0.0.10/31
    - endpoints: ["pe3:eth2", "p2:eth4"]    # 10.0.0.12/31
    - endpoints: ["pe4:eth1", "p1:eth5"]    # 10.0.0.14/31
    - endpoints: ["pe4:eth2", "p2:eth5"]    # 10.0.0.16/31
    # RRs dual-attached to core
    - endpoints: ["rr1:eth1", "p1:eth6"]    # 10.0.0.18/31
    - endpoints: ["rr1:eth2", "p2:eth6"]    # 10.0.0.20/31
    - endpoints: ["rr2:eth1", "p1:eth7"]    # 10.0.0.22/31
    - endpoints: ["rr2:eth2", "p2:eth7"]    # 10.0.0.24/31
    # site-A customer (ce1 dual-homed to pe1+pe2)
    - endpoints: ["ce1:eth1", "pe1:eth3"]   # 10.1.1.0/31
    - endpoints: ["ce1:eth2", "pe2:eth3"]   # 10.1.1.2/31
    # site-B customer (ce2 dual-homed to pe3+pe4)
    - endpoints: ["ce2:eth1", "pe3:eth3"]   # 10.1.2.0/31
    - endpoints: ["ce2:eth2", "pe4:eth3"]   # 10.1.2.2/31
