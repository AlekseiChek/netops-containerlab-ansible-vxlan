---
# Snapshot live VyOS state BEFORE the change — baseline + evidence.
- name: Ensure artifacts dir exists
  ansible.builtin.file: { path: "{{ artifacts_dir }}", state: directory }
  delegate_to: localhost
  run_once: true

- name: Gather IS-IS / BGP / route state
  vyos.vyos.vyos_command:
    commands:
      - show isis neighbor
      - show bgp summary
      - show ip route summary
  register: pre
  changed_when: false

- name: Assert IS-IS has at least one Up adjacency
  ansible.builtin.assert:
    that: "'Up' in pre.stdout[0]"
    fail_msg: "{{ inventory_hostname }}: no IS-IS adjacency Up — risky to deploy"
    success_msg: "{{ inventory_hostname }}: IS-IS OK pre-deploy"

- name: Record baseline BGP down-peer count (Active/Idle/Connect)
  ansible.builtin.set_fact:
    pre_bgp_down: "{{ pre.stdout[1] | regex_findall('Active|Idle|Connect') | length }}"

- name: Save precheck snapshot
  ansible.builtin.copy:
    dest: "{{ artifacts_dir }}/precheck_{{ inventory_hostname }}.txt"
    content: |
      === PRECHECK {{ inventory_hostname }} ===
      --- IS-IS neighbor ---
      {{ pre.stdout[0] }}
      --- BGP summary ---
      {{ pre.stdout[1] }}
      --- route summary ---
      {{ pre.stdout[2] }}
  delegate_to: localhost
