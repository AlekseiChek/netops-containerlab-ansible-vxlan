---
# eBGP make-before-break (vyos_config auto-commits). One reversible lever:
#  - BGP graceful-shutdown (RFC 8326): the node re-advertises its paths with the
#    GRACEFUL_SHUTDOWN community + lowest local-pref, so the fabric steers around it.
# In a Clos with two spines and dual-homed leaves, draining shifts traffic to the
# redundant path while sessions stay up. Reversible; no IGP involved.

- name: "DRAIN {{ inventory_hostname }} — BGP graceful-shutdown"
  vyos.vyos.vyos_config:
    lines:
      - set protocols bgp parameters graceful-shutdown
  when: drain_state | default('drain') == 'drain'

- name: "Wait for traffic to shift to the redundant spine/path"
  ansible.builtin.pause: { seconds: "{{ drain_wait }}" }
  when: drain_state | default('drain') == 'drain'

- name: "UNDRAIN {{ inventory_hostname }} — clear graceful-shutdown"
  vyos.vyos.vyos_config:
    lines:
      - delete protocols bgp parameters graceful-shutdown
  when: drain_state | default('drain') == 'undrain'
