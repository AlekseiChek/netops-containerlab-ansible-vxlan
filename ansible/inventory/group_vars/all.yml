---
ansible_python_interpreter: auto_silent   # FRR container has python3; silence discovery warning
artifacts_dir: "{{ playbook_dir }}/../artifacts"
convergence_wait: 12       # seconds to let eBGP/EVPN reconverge after a change
drain_wait: 8              # seconds to let traffic reroute after drain
deploy_route: "100.64.0.0/24"   # benign blackhole route used as the demo change
