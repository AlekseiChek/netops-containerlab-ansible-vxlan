---
# Clos fabric. VyOS (spine/leaf) via SSH (vyos.vyos / network_cli). Hosts = bonded L2 servers.
all:
  children:
    core:                # all VyOS fabric nodes — drain/reboot apply here
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: vyos.vyos.vyos
        ansible_user: vyos
        ansible_password: vyos
      hosts:
        spine1: { ansible_host: clab-stage1-spine1 }
        spine2: { ansible_host: clab-stage1-spine2 }
        leaf1:  { ansible_host: clab-stage1-leaf1 }
        leaf2:  { ansible_host: clab-stage1-leaf2 }
        leaf3:  { ansible_host: clab-stage1-leaf3 }
        leaf4:  { ansible_host: clab-stage1-leaf4 }
    spine:
      hosts: { spine1: {}, spine2: {} }
    leaf:
      hosts: { leaf1: {}, leaf2: {}, leaf3: {}, leaf4: {} }
    site_a:              # wave target
      hosts: { leaf1: {}, leaf2: {} }
    site_b:
      hosts: { leaf3: {}, leaf4: {} }
