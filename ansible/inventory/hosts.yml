---
# Clos fabric. VyOS (spine/leaf) via SSH (vyos.vyos / network_cli). CE = FRR via docker exec.
all:
  children:
    core:                # all VyOS fabric nodes — drain/reboot apply here
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: vyos.vyos.vyos
        ansible_user: vyos
        ansible_password: vyos
      hosts:
        p1:  { ansible_host: clab-stage1-p1 }
        p2:  { ansible_host: clab-stage1-p2 }
        pe1: { ansible_host: clab-stage1-pe1 }
        pe2: { ansible_host: clab-stage1-pe2 }
        pe3: { ansible_host: clab-stage1-pe3 }
        pe4: { ansible_host: clab-stage1-pe4 }
    spine:               # eBGP spines (AS 65100 / 65200) — relay EVPN
      hosts: { p1: {}, p2: {} }
    leaf:                # VTEPs (AS 65001-65004) — VRF CUST L3VNI 100
      hosts: { pe1: {}, pe2: {}, pe3: {}, pe4: {} }
    site_a:              # wave target
      hosts: { pe1: {}, pe2: {} }
    site_b:
      hosts: { pe3: {}, pe4: {} }
    ce:                  # FRR customer edge — docker exec, no SSH
      vars:
        ansible_connection: community.docker.docker
        ansible_python_interpreter: auto_silent
      hosts:
        ce1: { ansible_host: clab-stage1-ce1 }
        ce2: { ansible_host: clab-stage1-ce2 }
