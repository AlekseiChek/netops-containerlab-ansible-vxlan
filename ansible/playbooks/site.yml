---
# Safe rolling config change on the eBGP EVPN Clos: one node per wave, stop on first failure.
# Per node: drain -> precheck (EVPN health gate) -> deploy -> postcheck (gate) -> undrain.
#   ansible-playbook playbooks/site.yml                 (whole fabric, serial)
#   ansible-playbook playbooks/site.yml -e target=leaf3 (one node)
#   ansible-playbook playbooks/site.yml -e target=site_a
- name: NetOps safe change — drain -> precheck -> deploy -> postcheck -> undrain
  hosts: "{{ target | default('core') }}"
  gather_facts: false
  serial: 1                 # blast radius: one device per wave
  any_errors_fatal: true    # a failed health gate halts the whole rollout
  tasks:
    - import_role: { name: drain }
      vars: { drain_state: drain }
      tags: [drain]
    - import_role: { name: precheck }
      tags: [precheck]
    - import_role: { name: deploy }
      tags: [deploy]
    - import_role: { name: postcheck }   # deterministic gate (assert fails => stop)
      tags: [postcheck]
    - import_role: { name: drain }
      vars: { drain_state: undrain }
      tags: [undrain]
