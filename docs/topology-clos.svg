    <text x="418" y="804" class="m" font-size="12" fill="#9aa0a8">host1 10.10.10.11 · ESI-LAG</text>
    <circle cx="1014" cy="740" r="34" fill="#0e1012" stroke="#C7CDD4" stroke-width="3"/>
    <text x="1014" y="746" class="h" font-size="15" fill="#EDEAE3">host2</text>
