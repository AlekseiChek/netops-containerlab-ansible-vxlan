  <!-- info band -->
  <text x="60" y="868" class="m" font-size="14" fill="#5FB0B7">underlay+overlay eBGP (no RR/IGP) · ESI-LAG dual-homing + anycast gw · ONE stretched L2VNI 10010 (10.10.10.0/24) · host<->host = EVPN Type-2 bridged</text>

  <!-- legend -->
  <g transform="translate(60,892)">
    <polygon points="14,0 30,9 30,27 14,36 -2,27 -2,9" fill="#0e1012" stroke="#E08A3C" stroke-width="3"/>
