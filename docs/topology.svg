<svg xmlns="http://www.w3.org/2000/svg" width="720" height="710" viewBox="0 0 720 710" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="710" fill="#ffffff"/>
  <text x="360" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#0F2A3F">netops-lab — redundant 2-site IS-IS / iBGP fabric</text>

  <!-- tier labels -->
  <g font-size="11" fill="#7A8794">
    <text x="14" y="176">SITE-A</text>
    <text x="14" y="296">CORE (P)</text>
    <text x="14" y="416">RR</text>
    <text x="14" y="536">SITE-B</text>
  </g>

  <!-- LINKS -->
  <!-- eBGP (green) -->
  <g stroke="#27AE60" stroke-width="2" fill="none">
    <line x1="365" y1="72" x2="240" y2="172"/>
    <line x1="365" y1="72" x2="490" y2="172"/>
    <line x1="365" y1="652" x2="240" y2="532"/>
    <line x1="365" y1="652" x2="490" y2="532"/>
  </g>
  <!-- IS-IS L2 (blue) -->
  <g stroke="#2D9CDB" stroke-width="2" fill="none">
    <line x1="240" y1="172" x2="240" y2="292"/>
    <line x1="240" y1="172" x2="490" y2="292"/>
    <line x1="490" y1="172" x2="490" y2="292"/>
    <line x1="490" y1="172" x2="240" y2="292"/>
    <line x1="300" y1="292" x2="430" y2="292"/>
    <line x1="135" y1="412" x2="240" y2="292"/>
    <line x1="135" y1="412" x2="490" y2="292"/>
    <line x1="595" y1="412" x2="490" y2="292"/>
    <line x1="595" y1="412" x2="240" y2="292"/>
    <line x1="240" y1="532" x2="240" y2="292"/>
    <line x1="240" y1="532" x2="490" y2="292"/>
    <line x1="490" y1="532" x2="490" y2="292"/>
    <line x1="490" y1="532" x2="240" y2="292"/>
  </g>
  <!-- iBGP RR <-> RR (dashed) -->
  <line x1="200" y1="412" x2="530" y2="412" stroke="#8A98A6" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- NODES -->
  <g font-size="12" font-weight="bold" fill="#0F2A3F">
    <rect x="290" y="50" width="150" height="44" rx="7" fill="#EAF7EF" stroke="#27AE60" stroke-width="1.5"/>
    <text x="365" y="69" text-anchor="middle">ce1</text>
    <text x="365" y="84" text-anchor="middle" font-size="9" font-weight="normal" fill="#4F5963">AS65001 · 198.51.100.0/24</text>

    <rect x="180" y="150" width="120" height="44" rx="7" fill="#EFF3F7" stroke="#0F2A3F" stroke-width="1.5"/>
    <text x="240" y="169" text-anchor="middle">pe1</text>
    <text x="240" y="184" text-anchor="middle" font-size="9" font-weight="normal" fill="#4F5963">lo 192.0.2.1</text>
    <rect x="430" y="150" width="120" height="44" rx="7" fill="#EFF3F7" stroke="#0F2A3F" stroke-width="1.5"/>
    <text x="490" y="169" text-anchor="middle">pe2</text>
    <text x="490" y="184" text-anchor="middle" font-size="9" font-weight="normal" fill="#4F5963">lo 192.0.2.2</text>

    <rect x="180" y="270" width="120" height="44" rx="7" fill="#E7ECF1" stroke="#0F2A3F" stroke-width="1.5"/>
    <text x="240" y="289" text-anchor="middle">p1</text>
    <text x="240" y="304" text-anchor="middle" font-size="9" font-weight="normal" fill="#4F5963">lo 192.0.2.11</text>
    <rect x="430" y="270" width="120" height="44" rx="7" fill="#E7ECF1" stroke="#0F2A3F" stroke-width="1.5"/>
    <text x="490" y="289" text-anchor="middle">p2</text>
    <text x="490" y="304" text-anchor="middle" font-size="9" font-weight="normal" fill="#4F5963">lo 192.0.2.12</text>

    <rect x="70" y="390" width="130" height="44" rx="7" fill="#FBF1DA" stroke="#E0A526" stroke-width="1.5"/>
    <text x="135" y="409" text-anchor="middle">rr1 (RR)</text>
    <text x="135" y="424" text-anchor="middle" font-size="9" font-weight="normal" fill="#4F5963">lo .101 · cl 1.1.1.1</text>
    <rect x="530" y="390" width="130" height="44" rx="7" fill="#FBF1DA" stroke="#E0A526" stroke-width="1.5"/>
    <text x="595" y="409" text-anchor="middle">rr2 (RR)</text>
    <text x="595" y="424" text-anchor="middle" font-size="9" font-weight="normal" fill="#4F5963">lo .102 · cl 2.2.2.2</text>

    <rect x="180" y="510" width="120" height="44" rx="7" fill="#EFF3F7" stroke="#0F2A3F" stroke-width="1.5"/>
    <text x="240" y="529" text-anchor="middle">pe3</text>
    <text x="240" y="544" text-anchor="middle" font-size="9" font-weight="normal" fill="#4F5963">lo 192.0.2.3</text>
    <rect x="430" y="510" width="120" height="44" rx="7" fill="#EFF3F7" stroke="#0F2A3F" stroke-width="1.5"/>
    <text x="490" y="529" text-anchor="middle">pe4</text>
    <text x="490" y="544" text-anchor="middle" font-size="9" font-weight="normal" fill="#4F5963">lo 192.0.2.4</text>

    <rect x="290" y="630" width="150" height="44" rx="7" fill="#EAF7EF" stroke="#27AE60" stroke-width="1.5"/>
    <text x="365" y="649" text-anchor="middle">ce2</text>
    <text x="365" y="664" text-anchor="middle" font-size="9" font-weight="normal" fill="#4F5963">AS65002 · 203.0.113.0/24</text>
  </g>

  <!-- legend -->
  <g font-size="10.5" fill="#4F5963">
    <line x1="120" y1="694" x2="150" y2="694" stroke="#27AE60" stroke-width="2"/>
    <text x="156" y="698">eBGP (CE dual-homed: ce1→pe1/pe2, ce2→pe3/pe4)</text>
    <line x1="470" y1="694" x2="500" y2="694" stroke="#2D9CDB" stroke-width="2"/>
    <text x="506" y="698">IS-IS L2 (each PE/RR → both P)</text>
  </g>
</svg>
